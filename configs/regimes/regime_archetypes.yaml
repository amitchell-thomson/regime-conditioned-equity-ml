# Regime archetype pool for dynamic labeling.
#
# Each archetype defines a signature vector over the 5 macro groups:
#   rates, inflation, real_economy, credit, volatility
#
# Sign convention (consistent with PCA sign anchoring in group_pca.py):
#   POSITIVE = economically GOOD / elevated in the beneficial direction.
#   e.g. credit: +1.0       → easy financial conditions (low NFCI, tight spreads)
#        volatility: +1.0   → calm markets (low VIX)
#        real_economy: +1.5 → above-trend growth + tight labour market
# This matches the anchored PCA convention where positive PC1 = good conditions.
#
# rates_pc1 ORIENTATION (derived from PCA loadings on IS data):
#   PC1 is dominated by T10Y2Y (+0.504) and T10Y3M (+0.494) minus FEDFUNDS (-0.451).
#   POSITIVE rates_pc1 = steep yield curve + low short rates (easing cycle / post-crisis)
#   NEGATIVE rates_pc1 = inverted yield curve + high short rates (tightening cycle / pre-recession)
#   This is empirically confirmed:
#     2007-09 GFC (Fed cut 5.25%→0%, curve steepened): rates_pc1 = +3.8
#     2022 hiking cycle (curve inverted -0.6%): rates_pc1 = -2.8
#     2013 taper tantrum (10Y spiked, curve steepened): rates_pc1 = +2.5
#
# real_economy_pc1 ORIENTATION:
#   PC1 dominated by CFNAI, INDPRO, PAYEMS (positive) and UNRATE, ICSA (negative).
#   POSITIVE real_economy_pc1 = strong growth + tight labour market (expansion).
#   NEGATIVE real_economy_pc1 = weak growth + labour market stress (recession / crisis).
#
# credit_pc1 ORIENTATION:
#   PC1 dominated by NFCI (flipped: good_direction=low) and BAA10Y (flipped).
#   POSITIVE credit_pc1 = easy financial conditions (low NFCI, tight spreads).
#   NEGATIVE credit_pc1 = financial stress (high NFCI, wide credit spreads).
#
# volatility_pc1 ORIENTATION:
#   PC1 = VIXCLS (flipped: good_direction=low).
#   POSITIVE volatility_pc1 = calm markets (low VIX).
#   NEGATIVE volatility_pc1 = market stress (high VIX).
#
# The labeling algorithm uses cosine similarity to match detected HMM states
# to archetypes via linear assignment (no archetype assigned to two states).
#
# Thresholds control when a label is assigned vs flagged as unclassified.
# Tune here — never in source code.

# The five macro groups used by the labeling algorithm. Must match the group names
# defined in regime_config.yaml (feature_selection.group_pca.n_components) and the
# PCA column prefixes produced by GroupPCATransformer (e.g. "rates_pc1").
# If this list is updated here, also update regime_config.yaml and GroupPCATransformer.
groups:
  - rates
  - inflation
  - real_economy
  - credit
  - volatility

label_config:
  min_confidence: 0.18   # min cosine similarity for a named label
  # Margin below which a matched state is flagged as margin_warning=True in label results.
  # Thin margins indicate two archetypes are nearly equally valid — the label is still
  # assigned but downstream conditioning on that state should be treated with caution.
  # Use soft probabilities (filter_proba) when margin_warning is True.
  margin_warning_threshold: 0.08
  # Fraction of episode days that must fall in the expected-archetype state to count as
  # a match in validate_against_episodes(). Threshold-based matching is more robust than
  # dominant-state matching for long, multi-phase episodes (e.g. a 19-month episode can
  # reasonably have 45% expected state without the dominant state being the expected one).
  episode_match_threshold: 0.40

archetypes:
  expansion:
    display_name: "Expansion"
    signatures:
      real_economy: 1.2    # strong growth + tight labour market (CFNAI high, UNRATE low, PAYEMS rising)
      credit: 1.0          # easy financial conditions (low NFCI, tight spreads)
      volatility: 1.0      # calm markets (low VIX)
      inflation: -0.3      # subdued inflation (below target)
      rates: 0.4           # accommodative/normal curve (FEDFUNDS low, curve not inverted)

  policy_constrained:
    display_name: "Policy Tightening"
    # Fed ahead of the curve: aggressively hiking to kill inflation while growth is still positive.
    # Growth is still positive (real_economy > 0), curve is very inverted (Fed is deliberately
    # restrictive), credit conditions are merely tight — not crisis-level.
    # Canonical periods: 2018 late-cycle tightening, 2022-24 hiking cycle.
    signatures:
      rates: -1.5          # very inverted yield curve (aggressive tightening, curve deliberately inverted)
      inflation: 1.0       # above-target inflation driving tightening
      real_economy: 0.5    # positive growth + firm labour market — key differentiator from stagflation
      credit: 0.2          # financial conditions tight but not crisis (2022-24: VIX <25, IG spreads contained)
      volatility: -0.3     # mildly elevated equity volatility despite policy stress

  recovery:
    display_name: "Recovery"
    signatures:
      real_economy: 0.7    # recovering activity + labour market healing
      credit: 0.6          # risk appetite returning, spreads tightening
      volatility: 0.6      # calm markets, VIX normalising
      inflation: -0.2      # inflation still subdued
      rates: 0.7           # steep yield curve (Fed at low/zero, curve normalized post-crisis)

  liquidity_crisis:
    display_name: "Liquidity Crisis"
    signatures:
      credit: -2.5         # extreme credit stress — NFCI >3σ, spreads blown out (GFC: BAA10Y +600bps, COVID: +400bps)
      volatility: -2.5     # extreme equity volatility — VIX >40 (GFC peak: 80, COVID peak: 65)
      real_economy: -1.0   # growth impaired + significant job losses
      inflation: -0.3      # deflationary pressure
      rates: 1.5           # very steep curve — emergency rate cuts (Fed to 0%) sharply steepen the curve

  slowdown:
    display_name: "Late-Cycle Disinflation"
    # Strong disinflation is the dominant signal. Growth is flat but labour market intact —
    # this is a mid-cycle soft-patch or late-cycle pause, not an outright recession.
    # The yield curve reflects residual inversion from a prior tightening cycle that is fading.
    # real_economy set to 0.0 (flat, not slightly positive) so the archetype does not
    # attract mild expansion periods. credit set to 0.0 (neutral) because late-cycle
    # disinflation episodes (2015-16, 2019, 2023) did not feature meaningful spread widening.
    # Canonical periods: dot-com slowdown 2000-01, commodity bust 2015-16,
    #                    trade-war 2019, rapid disinflation 2023.
    signatures:
      inflation: -1.0      # strong disinflation — the dominant signal
      rates: -0.8          # mildly inverted curve (residual from prior tightening; fading)
      real_economy: 0.0    # flat growth, labour market intact but not strengthening
      credit: 0.0          # neutral credit (no meaningful spread widening in typical soft-patch)
      volatility: -0.5     # VIX mildly elevated (15-25 range, not crisis-level)

# ---------------------------------------------------------------------------
# Archetype taxonomy: coarsened pools for smaller n_regime models
# ---------------------------------------------------------------------------
#
# When the winning HMM has fewer states (3 or 4), the canonical 5-archetype pool
# is too fine-grained to be matched 1-for-1. The pools below define explicit
# merged archetypes so that labeling and episode validation are fair across model
# sizes. Signatures are weighted averages of the constituent canonical archetypes.
#
# Canonical archetypes (5): expansion, recovery, slowdown, policy_constrained, liquidity_crisis
#
# Hierarchy (canonical → coarse group):
#   Risk-on:          expansion, recovery
#   Contraction:      slowdown, policy_constrained
#   Crisis:           liquidity_crisis (stands alone at all granularities)
#
# Pool routing in label_regimes():
#   K <= 3 → n3 pool (risk_on, contraction, crisis)
#   K == 4 → n4 pool (risk_on, contraction, inflation_policy, crisis)
#   K >= 5 → canonical pool (all 5 archetypes, square linear assignment — 1-for-1 matching)

taxonomy:
  # Maps canonical archetype keys to coarsened keys for each pool level.
  # Used by validate_against_episodes() to translate episode expectations
  # (written in canonical space) to the pool used by the current model.
  canonical_to_coarse:
    n3:
      expansion: risk_on
      recovery: risk_on
      slowdown: contraction
      policy_constrained: contraction
      liquidity_crisis: crisis
    n4:
      expansion: risk_on
      recovery: risk_on
      slowdown: contraction
      policy_constrained: inflation_policy
      liquidity_crisis: crisis

pools:
  # 3-state pool: broad risk-on / contraction / crisis taxonomy.
  # policy_constrained folds into contraction because at 3-state granularity the model
  # cannot distinguish inflation stress from growth weakness. Contraction blends slowdown
  # and policy_constrained; inflation signals partially cancel out (policy_constrained has
  # high inflation; slowdown has strong disinflation), giving a near-neutral inflation signal.
  n3:
    risk_on:
      display_name: "Risk-On"
      canonical_members: [expansion, recovery]
      signatures:
        real_economy: 1.0    # blend of expansion (1.2) + recovery (0.7)
        credit: 0.8          # blend of expansion (1.0) + recovery (0.6)
        volatility: 0.8      # blend of expansion (1.0) + recovery (0.6)
        inflation: -0.3      # blend of expansion (-0.3) + recovery (-0.2)
        rates: 0.5           # blend of expansion (0.4) + recovery (0.7)
    contraction:
      display_name: "Contraction"
      canonical_members: [slowdown, policy_constrained]
      signatures:
        real_economy: 0.2    # blend: slowdown(0.0) + policy_constrained(0.5) = 0.25 ≈ 0.2
        credit: 0.1          # blend: slowdown(0.0) + policy_constrained(0.2) = 0.1
        volatility: -0.4     # blend: slowdown(-0.5) + policy_constrained(-0.3) = -0.4
        inflation: 0.0       # inflation signals cancel: slowdown(-1.0) + policy_constrained(1.0) = 0.0
        rates: -1.1          # blend: slowdown(-0.8) + policy_constrained(-1.5) = -1.15 ≈ -1.1
    crisis:
      display_name: "Liquidity Crisis"
      canonical_members: [liquidity_crisis]
      signatures:
        credit: -2.5
        volatility: -2.5
        real_economy: -1.0
        inflation: -0.3
        rates: 1.5

  # 4-state pool: splits inflation/policy stress out of contraction.
  # policy_constrained maps to inflation_policy; slowdown maps to contraction.
  n4:
    risk_on:
      display_name: "Risk-On"
      canonical_members: [expansion, recovery]
      signatures:
        real_economy: 1.0
        credit: 0.8
        volatility: 0.8
        inflation: -0.3
        rates: 0.5
    contraction:
      display_name: "Contraction"
      canonical_members: [slowdown]
      signatures:
        real_economy: 0.0    # pure slowdown: flat growth, labour market intact
        credit: 0.0          # neutral credit (no meaningful spread widening in soft-patch)
        volatility: -0.5     # VIX mildly elevated (15-25 range, not crisis-level)
        inflation: -1.0      # strong disinflation — dominant signal
        rates: -0.8          # mildly inverted curve (residual from prior tightening)
    inflation_policy:
      display_name: "Inflation / Policy Stress"
      canonical_members: [policy_constrained]
      signatures:
        rates: -1.5          # very inverted yield curve (aggressive tightening)
        inflation: 1.0       # above-target inflation driving tightening
        real_economy: 0.5    # positive growth + firm labour market
        credit: 0.2          # financial conditions tight but not crisis
        volatility: -0.3     # mildly elevated equity volatility despite policy stress
    crisis:
      display_name: "Liquidity Crisis"
      canonical_members: [liquidity_crisis]
      signatures:
        credit: -2.5
        volatility: -2.5
        real_economy: -1.0
        inflation: -0.3
        rates: 1.5
