# Known macro economic episodes for regime label validation.
#
# Each episode specifies a date range and the archetype key we expect to
# dominate. validate_against_episodes() checks what fraction of days in each
# episode fell in the state assigned to the expected archetype.
#
# ANALYSIS ONLY — this file is never read in the fitting path or trading logic.
# expected_archetype must match a key in regime_archetypes.yaml.
#
# Pool routing: the active archetype pool depends on the winning model's n_regimes.
#   K <= 3  → n3 pool (risk_on / contraction / crisis)
#   K == 4  → n4 pool (risk_on / contraction / inflation_policy / crisis)
#   K >= 5  → canonical pool (5 archetypes: expansion, recovery, slowdown, policy_constrained, liquidity_crisis)
#
# Episodes are written in canonical archetype space. validate_against_episodes() translates
# to the winning model's pool via taxonomy.canonical_to_coarse in regime_archetypes.yaml:
#   expansion / recovery     → risk_on          (n3, n4)
#   slowdown                 → contraction      (n3); contraction      (n4)
#   policy_constrained       → contraction      (n3); inflation_policy (n4)
#   liquidity_crisis         → crisis           (n3, n4)
#
# If a translated key is not assigned to any HMM state (e.g. a state is unclassified),
# that episode reports match_status="not_in_model" and is excluded from the applicable count.

episodes:
  - name: "Dot-com Bust"
    start: "2000-03-01"
    end: "2002-10-31"
    expected_archetype: "slowdown"          # tech-driven disinflation + growth slowdown; mild contraction, not systemic

  - name: "Post Dot-com Recovery"
    start: "2003-07-01"
    end: "2004-12-31"
    expected_archetype: "recovery"          # post-bust recovery: steep curve, healing labour, subdued CPI

  - name: "GFC 2008-09"
    start: "2007-10-01"
    end: "2009-06-30"
    expected_archetype: "liquidity_crisis"  # financial crisis, not a regular recession

  - name: "Post-GFC Recovery"
    start: "2009-07-01"
    end: "2011-12-31"
    expected_archetype: "recovery"          # post-GFC recovery: zero rates, steep curve, labour healing

  - name: "2013 Taper Tantrum"
    start: "2013-05-01"
    end: "2013-12-31"
    expected_archetype: "expansion"      # No actual rate hikes; equities rallied; risk-on

  - name: "2014-2015 Bull Market Peak"
    start: "2014-01-01"
    end: "2014-12-31"
    expected_archetype: "expansion"      # Strong labour + moderate growth before commodity bust

  - name: "2015-2016 China & Commodity Slowdown"
    start: "2015-01-01"
    end: "2016-12-31"
    expected_archetype: "slowdown"       # Disinflation, near-zero growth, oil collapse, VIX spikes

  - name: "2017 Expansion"
    start: "2017-01-01"
    end: "2017-12-31"
    expected_archetype: "expansion"      # Global synchronised growth, low VIX, earnings acceleration

  - name: "2018 Late-Cycle Tightening"
    start: "2018-01-01"
    end: "2018-12-31"
    expected_archetype: "policy_constrained"  # Fed hiking, curve flattening, trade war

  - name: "2019 Late-Cycle Slowdown"
    start: "2019-01-01"
    end: "2020-02-14"
    expected_archetype: "slowdown"       # Yield curve inverted, trade war fears, global slowdown; inflation tame

  - name: "COVID Crash"
    start: "2020-02-15"
    end: "2020-04-30"
    expected_archetype: "liquidity_crisis"

  - name: "Post-COVID Recovery"
    start: "2020-06-01"
    end: "2021-11-30"
    expected_archetype: "recovery"          # post-COVID recovery: zero rates, steep curve, healing labour

  - name: "Inflation Regime 2022"
    start: "2021-12-01"
    end: "2023-06-30"
    expected_archetype: "policy_constrained"  # Fed hiking aggressively; curve inverted

  - name: "2023 Disinflation Slowdown"
    start: "2023-07-01"
    end: "2024-03-31"
    expected_archetype: "slowdown"       # Rapid disinflation, growth fears, labour still intact

  - name: "2024 Soft Landing"
    start: "2024-04-01"
    end: "2024-12-31"
    expected_archetype: "expansion"      # Fed pivot expected, labour robust, equity rally

  - name: "2025 Policy Uncertainty"
    start: "2025-01-01"
    end: "2025-06-30"
    expected_archetype: "slowdown"       # Tariff uncertainty, growth fears; but inflation not surging
