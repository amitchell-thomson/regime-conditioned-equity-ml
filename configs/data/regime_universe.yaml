regime_universe:
  calendar: business

  # Override with MACRO_DATA_PATH environment variable (set in .env — see .env.example).
  data_path: "/Users/alecmitchell-thomson/projects/quant-data/macro"
  raw_path: "data/raw/macro_raw.parquet"
  processed_path: "data/processed/macro_processed.parquet"
  raw_features_path: "data/features/macro_features_raw.parquet"
  feature_metadata_path: "data/features/feature_metadata.yaml"
  ready_features_path: "data/features/macro_features_ready.parquet"
  pca_loadings_dir: "data/features/pca_loadings"

  lookback:
    start: "1985-01-01"
    end: "2026-01-23"

  # Maximum days a forward-filled value is considered valid, by native frequency.
  # After this many calendar days without a new observation, value is set to NaN.
  max_staleness_days:
    daily: 5 # >1 week stale -> NaN (handles weekends + short FRED outages)
    weekly: 21 # >3 weeks -> NaN
    monthly: 65 # >~2 months -> NaN (catches discontinued series)
    irregular: 65
    unknown: 65

  # ALFRED vintage data settings (Archival FRED -- real-time point-in-time data).
  # ALFRED eliminates publication-lag and revision lookahead bias by using values
  # as they were known on each date. Routing is controlled per-series via use_alfred.
  alfred:
    use_alfred:
      false # Global fallback for series without an explicit use_alfred override.
      # All configured series define use_alfred explicitly; this is a
      # safety net for any future series added without a flag.

  # Global transform defaults.
  # winsorize_sigma: symmetric clip bound applied after z-score for fat-tailed series.
  # Applied to VIX and NFCI only — the two series with documented heavy tails.
  # Never hardcode this value: always reference it here.
  transforms:
    winsorize_sigma: 4.0

  # ---------------------------------------------------------------------------
  # Transform window / period semantics
  # ---------------------------------------------------------------------------
  # All window and periods values in transform chains below are expressed in units
  # of the series' NATIVE frequency — not calendar days or forward-filled daily rows.
  #
  #   daily series  (DGS10, T10Y2Y, T10Y3M, BAA10Y, VIXCLS):
  #       window/periods = trading days  (252 ≈ 1 year, 126 ≈ 6 months, 63 ≈ 1 quarter)
  #
  #   weekly series (ICSA, NFCI):
  #       window/periods = calendar weeks  (52 ≈ 1 year, 13 ≈ 1 quarter, 4 ≈ 1 month)
  #
  #   monthly series (FEDFUNDS, CPIAUCSL, CFNAI, INDPRO, UNRATE, PAYEMS):
  #       window/periods = calendar months  (36 ≈ 3 years, 12 = 1 year, 3 = 1 quarter)
  #
  # Staleness-aware transforms (staleness_mode='strict', the default) count only real
  # observations — forward-filled daily rows do NOT increment the window counter.
  # This means a window=36 on a monthly series always spans 36 actual publications,
  # regardless of how many calendar days have elapsed.
  # ---------------------------------------------------------------------------

  series:
    # ============================
    # Rates & Yield Curve
    # 4 series | 6 features
    # PC1 = monetary policy stance / curve slope
    #   T10Y2Y, T10Y3M load positively; FEDFUNDS loads negatively on PC1.
    #   Sign anchor: T10Y2Y (good_direction=high) enforces positive = steep/easing.
    # DGS2 dropped: algebraically redundant (DGS2 = DGS10 - T10Y2Y, which is already
    #   in the group; level captured by FEDFUNDS). Removes one column with no new info.
    # ============================
    fedfunds:
      id: FEDFUNDS
      use_alfred: false # Effective rate published next business day; minimal revision
      category: rates
      frequency: monthly
      name: "Federal Funds Rate"
      description: "Primary US monetary policy rate; anchors the short end of the yield curve."
      transforms:
        - [level, { z_score: { window: 12 } }] # Policy stance level (12 months ≈ 1 year)
        - [{ diff: { periods: 3 } }, { z_score: { window: 36 } }] # Hiking/cutting cycle magnitude (3-month change, 3yr window)

    ust10y:
      id: DGS10
      use_alfred: false # Market-quoted daily data; FRED never revises it
      category: rates
      frequency: daily
      name: "10Y Treasury yield"
      description: "Benchmark long-term nominal rate; growth/inflation/term-premium mix."
      transforms:
        - [level, { z_score: { window: 252 } }] # Long-term rate level
        - [{ diff: { periods: 63 } }, { z_score: { window: 252 } }] # Medium-term rate shift

    yc_10_2y:
      id: T10Y2Y
      use_alfred: false # Market-quoted daily spread; no revision
      category: rates
      frequency: daily
      name: "10Y-2Y yield curve slope"
      description: "Classic recession indicator; captures near-to-long rate differential."
      transforms:
        - [level, { z_score: { window: 252 } }] # Curve slope level

    yc_10_3m:
      id: T10Y3M
      use_alfred: false # Market-quoted daily spread
      category: rates
      frequency: daily
      name: "10Y-3M yield curve slope"
      description: "Strongest recession predictor; captures policy-rate-to-long-end differential."
      transforms:
        - [level, { z_score: { window: 252 } }] # Curve slope level
        - [{ diff: { periods: 63 } }, { z_score: { window: 252 } }] # Steepening/flattening trend

    # ============================
    # Inflation: Realised
    # 1 series | 1 feature
    # PC1 = inflation level (positive = elevated CPI; negative = disinflation).
    # No sign anchor: positive CPI YoY z-score naturally = high inflation, which is
    # the correct orientation for archetype matching (expansion: -0.3, policy_constrained: +1.0).
    # Dropped: PCEPILFE (feature start 2004), T10YIE (2004), T5YIFR (2004),
    #          AHETPI (2004), M2SL (r=-0.16 vs CPI in IS window — non-stationary post-QE).
    # Using CPIAUCSL alone (back to 1985) preserves the full IS window.
    # ============================
    cpi_headline:
      id: CPIAUCSL
      use_alfred: true # BLS release; headline CPI subject to methodological revisions
      category: inflation
      frequency: monthly
      name: "Headline CPI (all urban consumers)"
      description: "Broad consumer price level; the primary market-focal inflation benchmark."
      transforms:
        - [
            { yoy: { periods: 12, method: pct_change } },
            { z_score: { window: 36 } },
          ] # YoY inflation rate

    # ============================
    # Real Economy (merged growth + employment into one group)
    # 5 series | 7 features
    # PC1 = business cycle / real activity factor
    #   CFNAI, INDPRO, PAYEMS load positively (expansion); UNRATE, ICSA negatively (stress).
    #   Sign anchor: CFNAI (good_direction=high) enforces positive = strong real economy.
    # Rationale for merge: INDPRO vs PAYEMS r=0.656, PAYEMS vs UNRATE r=-0.619 —
    #   growth and employment are the same business cycle factor in this feature space.
    #   Separate PCA groups extracted nearly collinear PC1s, wasting model capacity.
    # Dropped: UMCSENT (feature start 2003, redundant with CFNAI composite),
    #          AHETPI (feature start 2004, wage pressure is in inflation),
    #          JTSJOL (feature start 2005 — was the binding IS-window constraint).
    # ============================
    cfnai:
      id: CFNAI
      use_alfred: false # Heavily revised in first 1-2 years after release, however only have alfred from ~2010, so the possibility of revision lookahead bias is a voluntary concession
      category: real_economy
      frequency: monthly
      name: "Chicago Fed National Activity Index"
      description: "85-indicator composite of national economic activity; designed for business-cycle detection."
      transforms:
        - [level, { z_score: { window: 36 } }] # Activity level
        - [{ diff: { periods: 3 } }, { z_score: { window: 36 } }] # Medium-term momentum

    indpro:
      id: INDPRO
      use_alfred: true # Fed statistical release; subject to benchmark revisions
      category: real_economy
      frequency: monthly
      name: "Industrial Production Index"
      description: "Manufacturing and mining output; high-frequency cyclical activity measure."
      transforms:
        - [
            { yoy: { periods: 12, method: pct_change } },
            { z_score: { window: 36 } },
          ] # YoY industrial growth

    jobless_claims:
      id: ICSA
      use_alfred: false # DOL administrative data; revised weekly with seasonal adjustment changes
      category: real_economy
      frequency: weekly
      name: "Initial jobless claims"
      description: "Leading labour stress indicator; high-frequency signal of layoff activity."
      transforms:
        - [{ ma: { window: 4 } }, { z_score: { window: 50 } }] # Smoothed level
        - [
            { ma: { window: 4 } },
            { pct_change: { periods: 13 } },
            { z_score: { window: 50 } },
          ] # Quarterly deterioration

    unemployment:
      id: UNRATE
      use_alfred: true # BLS; revised with annual benchmarks and seasonal adjustment
      category: real_economy
      frequency: monthly
      name: "Unemployment rate"
      description: "Headline lagging labour market indicator; regime-confirming cyclical benchmark."
      transforms:
        - [level, { z_score: { window: 36 } }] # Unemployment level
        - [{ diff: { periods: 3 } }, { z_score: { window: 36 } }] # Sahm-style 3-month change

    nonfarm_payrolls:
      id: PAYEMS
      use_alfred: true # BLS; large initial revisions common at turning points
      category: real_economy
      frequency: monthly
      name: "Nonfarm payroll employment"
      description: "Core employment growth signal; primary Jobs Report headline."
      transforms:
        - [
            { yoy: { periods: 12, method: pct_change } },
            { z_score: { window: 36 } },
          ] # Annual employment trend

    # ============================
    # Credit & Financial Conditions
    # 2 series | 3 features
    # PC1 = credit stress (positive = easy/calm; negative = stressed/tight)
    #   Sign anchor: NFCI (good_direction=low) — high NFCI = stress = bad → flip.
    # IS correlation NFCI vs BAA10Y r=0.709: strong enough for a meaningful PC1.
    # Dropped: BAMLH0A0HYM2 (feature start 2001; NFCI+BAA10Y sufficient for credit stress),
    #          M2SL (r=-0.16 vs CPI; interpretation structurally different pre/post-QE),
    #          WALCL (feature start 2005; only meaningful post-QE era).
    # VIX moved to its own volatility group: VIX and credit diverge in 2022 (VIX 30+,
    #   IG spreads contained) and 2015-16 (VIX spike, credit stable) — keeping them
    #   separate lets the HMM see these divergences as distinct state signals.
    # ============================
    nfci:
      id: NFCI
      use_alfred: false # Composite index; subject to methodology revisions
      category: credit
      frequency: weekly
      name: "Chicago Fed National Financial Conditions Index"
      description: "Broad financial conditions/stress composite; captures tightening/loosening of credit and funding."
      transforms:
        - [level, { z_score: { window: 50 } }, { winsorize: { sigma: 4.0 } }] # Current financial conditions
        - [
            { diff: { periods: 21 } },
            { z_score: { window: 50 } },
            { winsorize: { sigma: 4.0 } },
          ] # Tightening/loosening rate

    baa10y_spread:
      id: BAA10Y
      use_alfred: false # Market-quoted spread; no revision
      category: credit
      frequency: daily
      name: "BAA-10Y credit spread"
      description: "Investment-grade credit stress proxy; widens during risk-off and funding stress."
      transforms:
        - [level, { z_score: { window: 252 } }] # Credit stress level

    # ============================
    # Volatility
    # 1 series | 1 feature
    # PC1 = equity implied volatility (positive = calm; negative = stressed).
    # Sign anchor: VIXCLS (good_direction=low) → positive = low VIX = calm market.
    # Separated from credit: VIX diverges from credit spreads in key regimes.
    # Effective feature start: ~1991-01 (VIXCLS raw from 1990-01 + ~252d burnin).
    # IS window with this group (1991→2021): ~7,500 obs vs. previous 3,911 — 92% more data.
    # ============================
    vix:
      id: VIXCLS
      use_alfred: false # Market-quoted daily data; FRED never revises it
      category: volatility
      frequency: daily
      name: "CBOE Volatility Index"
      description: "Market-implied equity volatility; proxy for fear, convexity demand, and risk-off stress."
      transforms:
        - [level, { z_score: { window: 126 } }, { winsorize: { sigma: 4.0 } }] # Absolute stress level (clipped at 4σ)
