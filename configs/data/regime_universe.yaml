regime_universe:
  calendar: business

  # Override with MACRO_DATA_PATH environment variable (set in .env — see .env.example).
  data_path: "/Users/alecmitchell-thomson/Desktop/Coding/quant-data/macro"
  raw_path: "data/raw/macro_raw.parquet"
  processed_path: "data/processed/macro_processed.parquet"
  raw_features_path: "data/features/macro_features_raw.parquet"
  ready_features_path: "data/features/macro_features_ready.parquet"
  pca_loadings_dir: "data/features/pca_loadings"

  lookback:
    start: "2000-01-02"
    end: "2026-01-23"

  # Maximum days a forward-filled value is considered valid, by native frequency.
  # After this many calendar days without a new observation, value is set to NaN.
  max_staleness_days:
    daily: 5        # >1 week stale -> NaN (handles weekends + short FRED outages)
    weekly: 21      # >3 weeks -> NaN
    monthly: 65     # >~2 months -> NaN (catches discontinued series)
    irregular: 65
    unknown: 65

  # ALFRED vintage data settings (Archival FRED -- real-time point-in-time data).
  # ALFRED eliminates publication-lag and revision lookahead bias by using values
  # as they were known on each date. Routing is controlled per-series via use_alfred.
  alfred:
    use_alfred: false     # Global fallback for series without an explicit use_alfred override.
                          # All configured series define use_alfred explicitly; this is a
                          # safety net for any future series added without a flag.

  # Global transform defaults.
  # winsorize_sigma: symmetric clip bound applied after z-score for fat-tailed series.
  # Applied to VIX and NFCI only — the two series with documented heavy tails.
  # Never hardcode this value: always reference it here.
  transforms:
    winsorize_sigma: 4.0

  series:
    # ============================
    # Rates & Yield Curve
    # 5 series | 8 features
    # PC1 = rate level / policy stance  (FEDFUNDS, DGS2, DGS10 load together)
    # PC2 = curve shape / inversion     (T10Y2Y and T10Y3M diverge at inversions)
    # ============================
    fedfunds:
      id: FEDFUNDS
      use_alfred: false     # Effective rate published next business day; minimal revision
      category: rates
      frequency: daily
      name: "Federal Funds Rate"
      description: "Primary US monetary policy rate; anchors the short end of the yield curve."
      transforms:
        - [level, {z_score: {window: 36}}]                             # Policy stance level
        - [{diff: {periods: 6}}, {z_score: {window: 36}}]              # Hiking/cutting cycle magnitude

    ust2y:
      id: DGS2
      use_alfred: false     # Market-quoted daily data; FRED never revises it
      category: rates
      frequency: daily
      name: "2Y Treasury yield"
      description: "Near-term policy expectations; front-end rates sensitivity."
      transforms:
        - [level, {z_score: {window: 252}}]                             # Front-end rate level

    ust10y:
      id: DGS10
      use_alfred: false     # Market-quoted daily data; FRED never revises it
      category: rates
      frequency: daily
      name: "10Y Treasury yield"
      description: "Benchmark long-term nominal rate; growth/inflation/term-premium mix."
      transforms:
        - [level, {z_score: {window: 252}}]                             # Long-term rate level
        - [{diff: {periods: 63}}, {z_score: {window: 252}}]            # Medium-term rate shift

    yc_10_2y:
      id: T10Y2Y
      use_alfred: false     # Market-quoted daily spread; no revision
      category: rates
      frequency: daily
      name: "10Y-2Y yield curve slope"
      description: "Classic recession indicator; captures near-to-long rate differential."
      transforms:
        - [level, {z_score: {window: 252}}]                             # Curve slope level

    yc_10_3m:
      id: T10Y3M
      use_alfred: false     # Market-quoted daily spread; ALFRED archive only from 2014 — binding constraint
      category: rates
      frequency: daily
      name: "10Y-3M yield curve slope"
      description: "Strongest recession predictor; captures policy-rate-to-long-end differential."
      transforms:
        - [level, {z_score: {window: 252}}]                             # Curve slope level
        - [{diff: {periods: 63}}, {z_score: {window: 252}}]            # Steepening/flattening trend

    # ============================
    # Liquidity & Financial Conditions
    # 6 series | 8 features
    # PC1 = credit/financial stress  (VIX, NFCI, BAA10Y spread, HY spread load together)
    # PC2 = monetary/balance-sheet liquidity  (M2, Fed BS diverge from stress direction)
    # ============================
    vix:
      id: VIXCLS
      use_alfred: false     # Market-quoted daily data; FRED never revises it
      category: liquidity
      frequency: daily
      name: "CBOE Volatility Index"
      description: "Market-implied equity volatility; proxy for fear, convexity demand, and risk-off stress."
      transforms:
        - [level, {z_score: {window: 126}}, {winsorize: {sigma: 4.0}}]  # Absolute stress level (clipped at 4σ — VIX has strong right skew)

    nfci:
      id: NFCI
      use_alfred: false      # Composite index; subject to methodology revisions
      category: liquidity
      frequency: weekly
      name: "Chicago Fed National Financial Conditions Index"
      description: "Broad financial conditions/stress composite; captures tightening/loosening of credit and funding."
      transforms:
        - [level, {z_score: {window: 50}}, {winsorize: {sigma: 4.0}}]                             # Current financial conditions (clipped at 4σ — NFCI has fat tails in stress periods)
        - [{diff: {periods: 21}}, {z_score: {window: 50}}, {winsorize: {sigma: 4.0}}]             # Tightening/loosening rate (clipped at 4σ)

    baa10y_spread:
      id: BAA10Y
      use_alfred: false     # Market-quoted spread; no revision
      category: liquidity
      frequency: daily
      name: "BAA-10Y credit spread"
      description: "Investment-grade credit stress proxy; widens during risk-off and funding stress."
      transforms:
        - [level, {z_score: {window: 252}}]                             # Credit stress level

    hy_spread:
      id: BAMLH0A0HYM2
      use_alfred: false     # ICE/BofA market data; published daily, no revision
      category: liquidity
      frequency: daily
      name: "High-yield OAS spread"
      description: "Sub-investment-grade credit risk premium; leading indicator of risk appetite and financial stress."
      transforms:
        - [level, {z_score: {window: 252}}]                             # Risk appetite level

    m2:
      id: M2SL
      use_alfred: true      # Fed H.6 release; seasonal adjustment and methodology revisions
      category: liquidity
      frequency: weekly
      name: "M2 money supply"
      description: "Broad monetary aggregate; proxy for system liquidity and QE/QT transmission."
      transforms:
        - [{yoy: {periods: 12, method: pct_change}}, {z_score: {window: 36}}]   # Annual money supply growth

    fed_bs:
      id: WALCL
      use_alfred: false      # Fed H.4.1; published weekly, occasionally restated
      category: liquidity
      frequency: weekly
      name: "Federal Reserve total assets"
      description: "Fed balance sheet size; direct measure of QE expansion and QT contraction."
      transforms:
        - [{pct_change: {periods: 52}}, {z_score: {window: 52}}]                # Annual QE/QT cycle

    # ============================
    # Inflation: Realised & Expected
    # 4 series | 6 features
    # PC1 = realised inflation level  (PCE core + CPI headline)
    # PC2 = forward-looking expectations anchor  (10Y breakeven + 5Y5Y forward)
    # ============================
    pce_core:
      id: PCEPILFE
      use_alfred: true      # BEA releases and revises; initial estimates often revised materially
      category: inflation
      frequency: monthly
      name: "Core PCE price index"
      description: "Fed's preferred inflation gauge; excludes food and energy."
      transforms:
        - [{yoy: {periods: 12, method: pct_change}}, {z_score: {window: 36}}]            # YoY inflation rate
        - [{yoy: {periods: 12, method: pct_change}}, {diff: {periods: 1}}, {z_score: {window: 36}}]  # Acceleration

    cpi_headline:
      id: CPIAUCSL
      use_alfred: true      # BLS release; headline CPI subject to methodological revisions
      category: inflation
      frequency: monthly
      name: "Headline CPI (all urban consumers)"
      description: "Broad consumer price level; the primary market-focal inflation benchmark."
      transforms:
        - [{yoy: {periods: 12, method: pct_change}}, {z_score: {window: 36}}]            # YoY inflation rate

    breakeven_10y:
      id: T10YIE
      use_alfred: false     # TIPS-derived daily market quote; no revision
      category: inflation
      frequency: daily
      name: "10Y breakeven inflation rate"
      description: "Market-implied 10-year inflation expectations; TIPS-Treasury spread."
      transforms:
        - [level, {z_score: {window: 252}}]                             # Expectations level
        - [{diff: {periods: 63}}, {z_score: {window: 252}}]            # Medium-term expectations trend

    forward_inflation_5y5y:
      id: T5YIFR
      use_alfred: false     # Derived market rate; published daily, no revision
      category: inflation
      frequency: daily
      name: "5Y5Y forward inflation expectation"
      description: "5-year, 5-year forward inflation rate; long-run credibility anchor independent of near-term inflation."
      transforms:
        - [level, {z_score: {window: 252}}]                             # Long-run credibility level

    # ============================
    # Growth, Activity & Real Economy
    # 4 series | 7 features
    # PC1 = real activity cycle  (CFNAI, INDPRO, oil price load positively in expansions)
    # PC2 = demand-side momentum  (consumer sentiment + oil diverge at turning points)
    # ============================
    cfnai:
      id: CFNAI
      use_alfred: false      # Composite index; heavily revised in first 1-2 years after release
      category: growth
      frequency: monthly
      name: "Chicago Fed National Activity Index"
      description: "85-indicator composite of national economic activity; designed for business-cycle detection."
      transforms:
        - [level, {z_score: {window: 36}}]                              # Activity level
        - [{diff: {periods: 3}}, {z_score: {window: 36}}]              # Medium-term momentum

    indpro:
      id: INDPRO
      use_alfred: true      # Fed statistical release; subject to benchmark revisions
      category: growth
      frequency: monthly
      name: "Industrial Production Index"
      description: "Manufacturing and mining output; high-frequency cyclical activity measure."
      transforms:
        - [{yoy: {periods: 12, method: pct_change}}, {z_score: {window: 36}}]            # YoY industrial growth

    consumer_sentiment:
      id: UMCSENT
      use_alfred: true      # Survey with preliminary and final release; materially revised
      category: growth
      frequency: monthly
      name: "University of Michigan Consumer Sentiment"
      description: "Household demand-side confidence; leads consumption and captures regime-level optimism/pessimism."
      transforms:
        - [level, {z_score: {window: 36}}]                              # Sentiment level
        - [{diff: {periods: 3}}, {z_score: {window: 36}}]              # Trend deterioration/improvement


    # ============================
    # Labour Market
    # 5 series | 8 features
    # PC1 = labour market health  (ICSA, UNRATE load negatively; PAYEMS, JTSJOL load positively)
    # PC2 = wage pressure / tightness  (AHETPI loads distinctly as labour inflation)
    # ============================
    jobless_claims:
      id: ICSA
      use_alfred: false      # DOL administrative data; revised weekly with seasonal adjustment changes
      category: employment
      frequency: weekly
      name: "Initial jobless claims"
      description: "Leading labour stress indicator; high-frequency signal of layoff activity."
      transforms:
        - [{ma: {window: 4}}, {z_score: {window: 50}}]                              # Smoothed level
        - [{ma: {window: 4}}, {pct_change: {periods: 13}}, {z_score: {window: 50}}] # Quarterly deterioration

    unemployment:
      id: UNRATE
      use_alfred: true      # BLS; revised with annual benchmarks and seasonal adjustment
      category: employment
      frequency: monthly
      name: "Unemployment rate"
      description: "Headline lagging labour market indicator; regime-confirming cyclical benchmark."
      transforms:
        - [level, {z_score: {window: 36}}]                              # Unemployment level
        - [{diff: {periods: 3}}, {z_score: {window: 36}}]              # Sahm-style 3-month change

    nonfarm_payrolls:
      id: PAYEMS
      use_alfred: true      # BLS; large initial revisions common at turning points
      category: employment
      frequency: monthly
      name: "Nonfarm payroll employment"
      description: "Core employment growth signal; primary Jobs Report headline."
      transforms:
        - [{yoy: {periods: 12, method: pct_change}}, {z_score: {window: 36}}]   # Annual employment trend

    wage_growth:
      id: AHETPI
      use_alfred: true      # BLS; revised with payroll benchmark revisions
      category: employment
      frequency: monthly
      name: "Average hourly earnings (all private)"
      description: "Nominal wage inflation; measures labour cost pressure and real income dynamics."
      transforms:
        - [{yoy: {periods: 12, method: pct_change}}, {z_score: {window: 36}}]            # Annual wage growth
        - [{yoy: {periods: 12, method: pct_change}}, {diff: {periods: 1}}, {z_score: {window: 36}}]  # Acceleration

    job_openings:
      id: JTSJOL
      use_alfred: false      # BLS JOLTS; released with ~6-week lag, subject to revision
      category: employment
      frequency: monthly
      name: "JOLTS job openings"
      description: "Labour demand indicator; captures structural tightness and demand for workers."
      transforms:
        - [{yoy: {periods: 12, method: pct_change}}, {z_score: {window: 36}}]   # Annual demand growth
