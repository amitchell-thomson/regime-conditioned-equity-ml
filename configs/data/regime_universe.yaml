regime_universe:
  frequency: 
  calendar: business

  # Override with MACRO_DATA_PATH environment variable (set in .env — see .env.example).
  data_path: "/Users/alecmitchell-thomson/Desktop/Coding/quant-data/macro"
  raw_path: "data/raw/macro_raw.parquet"
  processed_path: "data/processed/macro_processed.parquet"
  raw_features_path: "data/features/macro_features_raw.parquet"
  ready_features_path: "data/features/macro_features_ready.parquet"
  pca_loadings_dir: "data/features/pca_loadings"
  
  lookback:
    start: "2000-01-02"
    end: "2026-01-23"

  # Maximum days a forward-filled value is considered valid, by native frequency.
  # After this many calendar days without a new observation, value is set to NaN.
  max_staleness_days:
    daily: 5        # >1 week stale -> NaN (handles weekends + short FRED outages)
    weekly: 21      # >3 weeks -> NaN
    monthly: 65     # >~2 months -> NaN (catches discontinued series)
    irregular: 65
    unknown: 65

  # ALFRED vintage data settings (Archival FRED -- real-time point-in-time data).
  # ALFRED eliminates publication-lag lookahead bias by using values as they were
  # known on each date, not final revised values.
  alfred:
    use_alfred: false     # Global fallback for series without an explicit use_alfred override.
                          # All configured series define use_alfred explicitly, so this
                          # only affects hypothetical future series added without an override.
    # Approximate days between observation period end and first publication.
    # Used for documentation and as Tier-2 fallback when use_alfred=false.
    release_lag_days:
      CFNAI: 28            # Released ~4 weeks after reference month end
      INDPRO: 16           # Released ~mid-month for prior month
      PCEPILFE: 30         # Released ~30 days after reference month end
      VIXCLS: 1            # Published same day
      DGS2: 1
      DGS10: 1
      T10Y3M: 1
      NFCI: 4              # Published Thursday for prior week
      ICSA: 5              # Published Thursday for prior week

  series:
    # ============================
    # Risk / Financial Stress
    # ============================
    vix:
      id: VIXCLS
      use_alfred: false     # Market-quoted daily data; FRED never revises it
      category: stress
      frequency: daily
      name: "CBOE Volatility Index"
      description: "Market-implied equity volatility; proxy for fear, convexity demand, and risk-off stress."
      transforms:
        - [level, {z_score: {window: 63}}]  # Absolute stress level
        - [{diff: {periods: 5}}, {z_score: {window: 126}}]  # Short-term momentum
        - [{ma: {window: 21}}, {diff: {periods: 21}}, {z_score: {window: 252}}]  # Medium-term trend
        - [{pct_change: {periods: 1}}, {std: {window: 21}}, {z_score: {window: 126}}]  # Volatility of volatility

    nfci:
      id: NFCI
      use_alfred: true      # Composite index; subject to methodology revisions
      category: liquidity
      frequency: weekly
      name: "Chicago Fed National Financial Conditions Index"
      description: "Broad financial conditions/stress composite; captures tightening/loosening of credit and funding."
      transforms:
        - [level, {z_score: {window: 50}}]  # Current financial conditions
        - [{diff: {periods: 21}}, {z_score: {window: 50}}]  # Tightening/loosening rate
        - [{diff: {periods: 5}}, {diff: {periods: 5}}, {z_score: {window: 25}}]  # Acceleration

    # ============================
    # Monetary Policy & Yield Curve
    # ============================
    ust2y:
      id: DGS2
      use_alfred: false     # Market-quoted daily data; FRED never revises it
      category: rates
      frequency: daily
      name: "2Y Treasury yield"
      description: "Near-term policy expectations; front-end rates sensitivity."
      transforms:
        - [level, {z_score: {window: 252}}]

    ust10y:
      id: DGS10
      use_alfred: false     # Market-quoted daily data; FRED never revises it
      category: rates
      frequency: daily
      name: "10Y Treasury yield"
      description: "Benchmark long-term nominal rate; growth/inflation/term-premium mix."
      transforms:
        - [level, {z_score: {window: 252}}]  # Long-term rate level
        - [{diff: {periods: 21}}, {z_score: {window: 252}}]  # Growth/inflation expectations
        - [{diff: {periods: 1}}, {std: {window: 21}}, {z_score: {window: 126}}]  # Rate uncertainty

    yc_10_3m:
      id: T10Y3M
      use_alfred: false     # Market-quoted daily spread; ALFRED archive only from 2014 — binding constraint
      category: rates
      frequency: daily
      name: "10Y-3M yield curve slope"
      description: "Cycle/recession indicator; robust curve-slope measure."
      transforms:
        - [level, {z_score: {window: 252}}]  # Current curve slope (recession signal)
        - [{diff: {periods: 21}}, {z_score: {window: 252}}]  # Steepening/flattening
        - [{diff: {periods: 5}}, {z_score: {window: 126}}]  # Rate of adjustment

    # ============================
    # Inflation: Realised & Expected
    # ============================
    pce_core:
      id: PCEPILFE
      use_alfred: true      # BEA releases and revises; initial estimates often revised materially
      category: inflation
      frequency: monthly
      name: "Core PCE price index"
      transforms:
        - [{yoy: {periods: 12, method: pct_change}}, {z_score: {window: 36}}]  # 12 months YoY, 5yr window
        - [{yoy: {periods: 12, method: pct_change}}, {diff: {periods: 1}}, {z_score: {window: 36}}]
        - [{pct_change: {periods: 1}}, {z_score: {window: 36}}]  # 1-month change, 3yr window

    # ============================
    # Growth / Activity
    # ============================
    cfnai:
      id: CFNAI
      use_alfred: true      # Composite index; heavily revised in first 1-2 years after release
      category: growth
      frequency: monthly
      name: "Chicago Fed National Activity Index"
      transforms:
        - [level, {z_score: {window: 36}}]  # 3yr window (36 months)
        - [{diff: {periods: 1}}, {z_score: {window: 36}}]  # 1-month diff

    indpro:
      id: INDPRO
      use_alfred: true      # Fed statistical release; subject to benchmark revisions
      category: growth
      frequency: monthly
      name: "Industrial Production Index"
      transforms:
        - [{yoy: {periods: 12, method: pct_change}}, {z_score: {window: 36}}]  # 12 months YoY
        - [{yoy: {periods: 12, method: pct_change}}, {diff: {periods: 1}}, {z_score: {window: 36}}]
        - [{pct_change: {periods: 3}}, {z_score: {window: 36}}]  # 3-month change

    # ============================
    # Labour Market
    # ============================
    jobless_claims:
      id: ICSA
      use_alfred: true      # DOL administrative data; revised weekly with seasonal adjustment changes
      category: employment
      frequency: weekly
      name: "Initial jobless claims"
      description: "Leading labour stress indicator; use smoothed change to reduce weekly noise."
      transforms:
        - [{ma: {window: 4}}, {z_score: {window: 50}}]  # Smoothed absolute level
        - [{ma: {window: 4}}, {pct_change: {periods: 13}}, {z_score: {window: 50}}]  # Labour deterioration
        - [{ma: {window: 4}}, {pct_change: {periods: 4}}, {z_score: {window: 25}}]  # Rapid shifts
